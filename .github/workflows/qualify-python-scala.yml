name: Qualify python-scala-collections on x86_64

on:
  workflow_dispatch: {}

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse-checkout pinned SkillsBench task
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/benchflow-ai/skillsbench.git skillsbench
          cd skillsbench
          git sparse-checkout init --cone
          git sparse-checkout set tasks/python-scala-translation
          git checkout 9a1f4dd5f7659f75707435da3ce854b6e48321d1

      - name: Build task Docker image (context = environment/)
        run: |
          cd skillsbench/tasks/python-scala-translation
          docker build -t python-scala-translation -f environment/Dockerfile environment/

      - name: Start a long-lived container
        run: |
          docker run -d --name qualify-run python-scala-translation sleep infinity

      - name: Copy oracle and run it (generates /root/Tokenizer.scala)
        run: |
          cd skillsbench/tasks/python-scala-translation
          docker cp oracle/solve.sh qualify-run:/root/solve.sh
          docker exec -w /root qualify-run bash /root/solve.sh
          echo "--- Generated Tokenizer.scala (first 20 lines) ---"
          docker exec qualify-run head -20 /root/Tokenizer.scala

      - name: Copy verifier in and run it against the correct submission
        run: |
          cd skillsbench/tasks/python-scala-translation
          docker exec qualify-run mkdir -p /verifier
          docker cp verifier/test.sh qualify-run:/verifier/test.sh
          docker cp verifier/test_outputs.py qualify-run:/verifier/test_outputs.py
          docker exec -w /root qualify-run bash /verifier/test.sh || true
          echo "--- reward.txt (correct submission) ---"
          docker exec qualify-run cat /logs/verifier/reward.txt || echo "reward.txt not found"
          echo "--- verifier output.log ---"
          docker exec qualify-run cat /logs/verifier/output.log || echo "output.log not found"
          echo "--- sbt/scalac presence inside container ---"
          docker exec qualify-run bash -lc 'export PATH="$HOME/.local/share/coursier/bin:$PATH"; which sbt || echo "sbt NOT FOUND"; which scalac || echo "scalac NOT FOUND"'

      - name: Corrupt the submission and re-run the verifier (expect fail-closed)
        run: |
          cd skillsbench/tasks/python-scala-translation
          docker exec qualify-run bash -c 'echo "def thisIsDeliberatelyBroken(: = {" >> /root/Tokenizer.scala'
          docker exec -w /root qualify-run bash /verifier/test.sh || true
          echo "--- reward.txt (broken submission) ---"
          docker exec qualify-run cat /logs/verifier/reward.txt || echo "reward.txt not found"
          echo "--- verifier output.log (broken submission) ---"
          docker exec qualify-run cat /logs/verifier/output.log || echo "output.log not found"

      - name: Collect logs as artifact
        if: always()
        run: |
          mkdir -p collected-logs
          docker cp qualify-run:/logs collected-logs/ 2>/dev/null || true
          docker cp qualify-run:/root/Tokenizer.scala collected-logs/Tokenizer.scala 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-scala-collections-qualification-logs
          path: collected-logs/
          retention-days: 14

      - name: Clean up
        if: always()
        run: docker rm -f qualify-run || true
